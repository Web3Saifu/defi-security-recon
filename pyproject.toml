[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-security-recon"
version = "0.2.0"
description = "Evidence-first DeFi security recon and target-prioritization agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DeFi Security Recon"}]
dependencies = []

[project.scripts]
defi-recon = "defi_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

